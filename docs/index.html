<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Credenciales HN26</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --border: #d9dde3; --accent: #0b5cad; --accent-text: #ffffff;
    --error: #b42318; --ok-bg: #eef6ee; --ok-border: #9cc79c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e8ebef; --muted: #9aa4b1;
      --border: #2c333c; --accent: #4c9ef0; --accent-text: #0b1420;
      --error: #f87171; --ok-bg: #16261a; --ok-border: #2f6b3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  input {
    width: 100%; padding: 11px 12px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 18px; padding: 12px; font-size: 1rem; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button.link {
    width: auto; margin: 16px 0 0; padding: 0; background: none; color: var(--accent); font-weight: 500;
  }
  .error { color: var(--error); font-size: .9rem; margin: 12px 0 0; min-height: 1.2em; }
  .step-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }
  .cred { background: var(--ok-bg); border: 1px solid var(--ok-border); border-radius: 10px; padding: 16px; }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row span { display: block; font-size: .8rem; color: var(--muted); }
  .val { display: flex; gap: 8px; align-items: center; }
  .val code { flex: 1; font-size: 1rem; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .val button { width: auto; margin: 0; padding: 6px 10px; font-size: .8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Festival HN26</h1>
  <p class="sub">Consulta las credenciales de tu equipo.</p>

  <form id="f-cedula">
    <div class="step-label">Paso 1 de 2</div>
    <label for="cedula">Número de cédula</label>
    <input id="cedula" autocomplete="off" inputmode="text" placeholder="001-010190-0001A" required>
    <p class="hint">Con o sin guiones.</p>
    <button type="submit">Continuar</button>
    <p class="error" id="e-cedula" role="alert"></p>
  </form>

  <form id="f-equipo" hidden>
    <div class="step-label">Paso 2 de 2</div>
    <label for="equipo">Nombre de tu equipo</label>
    <input id="equipo" autocomplete="off" placeholder="Ej. Green Tech" required>
    <p class="hint">Tal como lo registraron. No importan mayúsculas, espacios ni tildes.</p>
    <button type="submit">Ver credenciales</button>
    <p class="error" id="e-equipo" role="alert"></p>
    <button type="button" class="link" data-reset>← Cambiar cédula</button>
  </form>

  <section id="resultado" hidden>
    <div class="step-label">Equipo <strong id="r-equipo"></strong></div>
    <div class="cred">
      <div class="row"><span>Correo</span><div class="val"><code id="r-correo"></code><button type="button" data-copy="r-correo">Copiar</button></div></div>
      <div class="row"><span>Contraseña</span><div class="val"><code id="r-pass"></code><button type="button" data-copy="r-pass">Copiar</button></div></div>
    </div>
    <p class="hint">No compartas estas credenciales fuera de tu equipo.</p>
    <button type="button" class="link" data-reset>← Consultar otra cédula</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
